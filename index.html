<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Shaik Luqman" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f6f5f2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Returning visitors this session skip the intro curtain before first paint. -->
    <script>
      try {
        if (sessionStorage.getItem("intro-seen")) document.documentElement.dataset.introSeen = "";
      } catch (e) {}
    </script>

    <!-- Page title, description, canonical, Open Graph / Twitter cards and
         JSON-LD. scripts/prerender.mjs rewrites this block per route at build
         time (from src/lib/seo.ts); these are the home-page defaults. -->
    <!-- seo:start -->
    <title>Shaik Luqman — Full-Stack &amp; Applied-AI Engineer</title>
    <meta
      name="description"
      content="Shaik Luqman — full-stack &amp; applied-AI engineer in Bengaluru. CSE at DSATM and BS in Data Science &amp; Applications at IIT Madras. Projects: MetroFlow, Suraksha."
    />
    <link rel="canonical" href="https://shaikluqman.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shaik Luqman" />
    <meta property="og:url" content="https://shaikluqman.vercel.app/" />
    <meta property="og:title" content="Shaik Luqman — Full-Stack &amp; Applied-AI Engineer" />
    <meta property="og:image" content="https://shaikluqman.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- seo:end -->

    <noscript>
      <!-- Without JavaScript: drop the intro/transition curtains and show
           the prerendered content that would otherwise animate in. -->
      <style>
        [data-preloader],
        [data-curtain] {
          display: none !important;
        }
        #root [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
